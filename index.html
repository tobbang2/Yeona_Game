<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="연아 한글놀이">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#E9DBFF">
<title>연아의 한글 놀이집</title>
<style>
:root{
  --wall:#E9DBFF; --wall-dot:#F6EEFF;
  --plum:#4B2A73; --plum-soft:#8D6CC0;
  --pink:#FF7EB8; --berry:#E8478F; --mint:#4FD6B4; --sun:#FFC93C;
  --sky:#6CC4FF; --lilac:#B79CFF; --peach:#FFB38A; --paper:#FFFDFE;
  --ok:#22B864; --bad:#FF4D5E; --cur:#FF7EB8;
  --font:"Apple SD Gothic Neo","AppleSDGothicNeo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  position:fixed;inset:0;font-family:var(--font);color:var(--plum);font-weight:800;
  background-color:var(--wall);
  background-image:radial-gradient(var(--wall-dot) 17%,transparent 18%),radial-gradient(var(--wall-dot) 17%,transparent 18%);
  background-size:56px 56px;background-position:0 0,28px 28px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;
}
img,svg{-webkit-user-drag:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}

/* 장난감 버튼 */
.tk{background:#fff;border:4px solid var(--plum);border-radius:22px;box-shadow:0 6px 0 var(--plum);transition:transform .08s,box-shadow .08s;font-weight:900}
.tk:active{transform:translateY(4px);box-shadow:0 2px 0 var(--plum)}
.tk:focus-visible,.swatch:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px);
}

/* ===== 고양이 ===== */
.cat{display:block;width:100%;height:auto;overflow:visible}
.cat .c-armL,.cat .c-armR,.cat .c-head,.cat .c-all{transform-box:view-box}
.cat .c-armL{transform-origin:70px 166px;transform:rotate(14deg)}
.cat .c-armR{transform-origin:150px 166px;transform:rotate(-14deg)}
.cat .c-head{transform-origin:110px 150px;animation:tilt 4s ease-in-out infinite}
.cat .c-tail{transform-box:fill-box;transform-origin:0% 100%;animation:swish 2.4s ease-in-out infinite}
.cat .c-eo{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.cat .c-eh,.cat .c-mo{display:none}
.cat.happy .c-eo,.cat.happy .c-mc{display:none}
.cat.happy .c-eh,.cat.happy .c-mo{display:inline}
.cat.wave .c-armR{animation:wave 1.1s ease-in-out infinite}
.cat.bob .c-all{animation:bob 2.2s ease-in-out infinite}
.cat.cheer .c-armL{animation:cheerL 3s linear infinite}
.cat.cheer .c-armR{animation:cheerR 3s linear infinite}
.cat.cheer .c-all{animation:hop 3s ease-in-out infinite}
.cat.cheer .c-head{animation:wobble 3s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes swish{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(-128deg)}50%{transform:rotate(-158deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes cheerL{0%{transform:rotate(14deg)}6%{transform:rotate(140deg)}13%{transform:rotate(122deg)}20%{transform:rotate(148deg)}27%{transform:rotate(122deg)}34%{transform:rotate(148deg)}41%{transform:rotate(124deg)}48%{transform:rotate(14deg)}52%{transform:rotate(-48deg)}58%{transform:rotate(-18deg)}64%{transform:rotate(-48deg)}70%{transform:rotate(-18deg)}76%{transform:rotate(-48deg)}82%{transform:rotate(-18deg)}88%{transform:rotate(-48deg)}95%{transform:rotate(-18deg)}100%{transform:rotate(14deg)}}
@keyframes cheerR{0%{transform:rotate(-14deg)}6%{transform:rotate(-140deg)}13%{transform:rotate(-122deg)}20%{transform:rotate(-148deg)}27%{transform:rotate(-122deg)}34%{transform:rotate(-148deg)}41%{transform:rotate(-124deg)}48%{transform:rotate(-14deg)}52%{transform:rotate(48deg)}58%{transform:rotate(18deg)}64%{transform:rotate(48deg)}70%{transform:rotate(18deg)}76%{transform:rotate(48deg)}82%{transform:rotate(18deg)}88%{transform:rotate(48deg)}95%{transform:rotate(18deg)}100%{transform:rotate(-14deg)}}
@keyframes hop{0%,48%,100%{transform:translateY(0)}10%,30%{transform:translateY(-18px)}20%,40%{transform:translateY(0)}64%,88%{transform:translateY(-4px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}12%{transform:rotate(-6deg)}24%{transform:rotate(6deg)}36%{transform:rotate(-6deg)}46%{transform:rotate(0)}70%{transform:rotate(4deg)}}

/* ===== 시작 화면 ===== */
.start{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:inherit;
  background-color:var(--wall);
  background-image:radial-gradient(var(--wall-dot) 17%,transparent 18%),radial-gradient(var(--wall-dot) 17%,transparent 18%);
  background-size:56px 56px;background-position:0 0,28px 28px;padding:24px}
.start-in{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.4vh,26px)}
.start-cat{width:min(38vh,62vw,360px)}
.toy-title{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:clamp(40px,7.4vmin,84px);font-weight:900;line-height:1.1}
.toy-title span{display:inline-block;color:var(--c);-webkit-text-stroke:3px var(--plum);paint-order:stroke fill;text-shadow:0 5px 0 var(--plum);transform:rotate(var(--r))}
.toy-title .gap{width:.3em}
.start-btn{font-size:clamp(34px,5.6vmin,54px);padding:.32em 1.3em;border-radius:999px;background:var(--sun);border-width:5px;box-shadow:0 9px 0 var(--plum);animation:pulse 1.6s ease-in-out infinite}
.start-btn:active{box-shadow:0 3px 0 var(--plum);transform:translateY(6px)}
.start-note{font-size:16px;font-weight:700;color:var(--plum-soft)}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.06}}

/* ===== 집 (홈) ===== */
#scr-home{align-items:center;justify-content:center}
.house{position:relative;width:min(94vw,1020px);display:flex;flex-direction:column;align-items:center}
.roof{position:relative;width:100%;height:clamp(110px,19vh,200px)}
.roof::before,.roof::after{content:"";position:absolute;inset:0}
.roof::before{background:var(--plum);clip-path:polygon(50% 0,100% 100%,0 100%)}
.roof::after{background:
  repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.18) 46px 50px),var(--pink);
  clip-path:polygon(50% 5.5%,97.4% 100%,2.6% 100%)}
.sign{position:absolute;z-index:2;left:50%;bottom:12%;transform:translateX(-50%) rotate(-2deg);white-space:nowrap;background:#fff;border:4px solid var(--plum);border-radius:18px;padding:.18em .7em;font-size:clamp(22px,3.6vmin,38px);font-weight:900;box-shadow:0 5px 0 var(--plum)}
.house-cat{position:absolute;z-index:3;right:1%;bottom:-8px;width:clamp(96px,15vmin,180px)}
.trim{width:96%;height:24px;background:radial-gradient(circle at 50% 0,var(--berry) 0 12px,var(--plum) 12.5px 15px,transparent 15.5px) 0 0/30px 24px repeat-x;margin-top:-2px;position:relative;z-index:1}
.house-body{width:94%;margin-top:-24px;padding:calc(24px + clamp(14px,2.4vh,28px)) clamp(14px,2.4vw,30px) clamp(16px,2.6vh,30px);
  background:repeating-linear-gradient(90deg,#FFF4FA 0 26px,#FFE8F4 26px 52px);
  border:5px solid var(--plum);border-top:0;border-radius:0 0 30px 30px;box-shadow:0 10px 0 rgba(75,42,115,.3);
  display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2.4vw,28px)}
.room{position:relative;height:clamp(220px,46vh,420px);border:5px solid var(--plum);border-radius:999px 999px 26px 26px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-shadow:0 8px 0 var(--plum);overflow:hidden;transition:transform .1s,box-shadow .1s}
.room:active{transform:translateY(5px);box-shadow:0 3px 0 var(--plum)}
.room:focus-visible{outline:5px solid var(--sky);outline-offset:4px}
.r-color{background:radial-gradient(#fff6 18%,transparent 19%) 0 0/34px 34px,var(--sun)}
.r-puzzle{background:linear-gradient(90deg,#fff5 2px,transparent 2px) 0 0/30px 30px,linear-gradient(#fff5 2px,transparent 2px) 0 0/30px 30px,var(--mint)}
.r-match{background:repeating-linear-gradient(135deg,#fff4 0 14px,transparent 14px 28px),var(--sky)}
.room-ic{font-size:clamp(64px,11vmin,120px);line-height:1;filter:drop-shadow(0 5px 0 rgba(75,42,115,.35))}
.room-name{background:#fff;border:4px solid var(--plum);border-radius:999px;padding:.2em .8em;font-size:clamp(22px,3.4vmin,34px);font-weight:900}
@media (orientation:portrait){
  .house-body{grid-template-columns:1fr}
  .room{height:clamp(130px,17vh,210px);flex-direction:row;gap:28px;border-radius:120px 120px 26px 26px/80px 80px 26px 26px}
}

/* ===== 게임 공통 상단바 ===== */
.bar{display:flex;align-items:center;gap:12px;flex:0 0 auto;min-height:66px}
.b-home{width:70px;height:62px;font-size:32px;background:var(--sun);display:grid;place-items:center}
.b-title{display:flex;align-items:center;gap:8px;font-size:clamp(20px,3vmin,30px);font-weight:900;background:#fff;border:4px solid var(--plum);border-radius:999px;padding:4px 20px 4px 10px;white-space:nowrap}
.b-title .ic{font-size:1.3em}
.spacer{flex:1}
.b-txt{height:62px;padding:0 20px;font-size:clamp(20px,2.8vmin,26px)}
.b-next{background:var(--mint)}
.stars{display:flex;gap:2px;font-size:clamp(28px,4vmin,40px);line-height:1}
.stars span{color:#fff;-webkit-text-stroke:2.5px var(--plum);paint-order:stroke fill;transition:color .2s,transform .2s}
.stars span.on{color:var(--sun);transform:scale(1.15) rotate(-8deg)}
@media (max-width:640px){.b-title .tx{display:none}.stars{font-size:24px}}

/* ===== 색칠하기 ===== */
.color-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.cwrap{position:relative;box-sizing:content-box;border:5px solid var(--plum);border-radius:30px;
  background:radial-gradient(#F1E8FF 12%,transparent 13%) 0 0/26px 26px,var(--paper);
  box-shadow:0 8px 0 rgba(75,42,115,.35);overflow:hidden;touch-action:none}
.cwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.cwrap.shine{animation:shine .9s ease-out}
@keyframes shine{0%{box-shadow:0 8px 0 rgba(75,42,115,.35),0 0 0 0 #FFC93C}50%{box-shadow:0 8px 0 rgba(75,42,115,.35),0 0 0 22px #FFC93Caa}100%{box-shadow:0 8px 0 rgba(75,42,115,.35),0 0 0 40px #FFC93C00}}
.pic{position:absolute;z-index:3;left:8px;top:8px;width:clamp(80px,11vmin,118px);height:clamp(80px,11vmin,118px);border-radius:50%;background:#fff;border:4px solid var(--plum);box-shadow:0 6px 0 var(--plum);font-size:clamp(46px,7vmin,72px);display:grid;place-items:center;line-height:1}
.pic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--plum)}
.dock{flex:0 0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.fx{display:flex;gap:10px}
.fxb{width:clamp(74px,9vmin,94px);height:clamp(86px,10.4vmin,104px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:clamp(15px,2vmin,18px)}
.fxb .sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--plum);display:grid;place-items:center;font-size:22px}
.fxb.sel{background:var(--sun);transform:translateY(4px);box-shadow:0 2px 0 var(--plum)}
.sw-crayon{background:var(--cur);background:repeating-linear-gradient(45deg,var(--cur) 0 4px,color-mix(in srgb,var(--cur) 60%,#fff) 4px 7px)}
.sw-sparkle{background:radial-gradient(circle at 70% 30%,#fff 0 10%,transparent 12%),var(--cur)}
.sw-rainbow{background:conic-gradient(#FF4757,#FF9F43,#FFD93D,#2ECC71,#5BC0FF,#9B59F6,#FF4757)}
.sw-gloss{background:var(--cur);background:radial-gradient(circle at 34% 30%,#fff 0 14%,color-mix(in srgb,var(--cur) 55%,#fff) 30%,var(--cur) 62%,color-mix(in srgb,var(--cur) 80%,#000) 100%)}
.palette{display:flex;align-items:center;gap:6px;min-width:0;background:#fff;border:4px solid var(--plum);border-radius:999px;padding:4px 6px}
.pal-arrow{flex:0 0 auto;width:54px;height:54px;border-radius:50%;background:var(--lilac);font-size:26px;color:#fff;border:3px solid var(--plum);display:grid;place-items:center}
.pal-arrow:active{transform:scale(.92)}
.swatches{flex:1;min-width:0;display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding:12px 10px;scrollbar-width:none;overscroll-behavior-x:contain}
.swatches::-webkit-scrollbar{display:none}
.swatch{flex:0 0 auto;width:clamp(62px,8vmin,78px);height:clamp(62px,8vmin,78px);border-radius:50%;border:4px solid var(--plum);scroll-snap-align:center;transition:transform .12s;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12),inset 6px 6px 0 rgba(255,255,255,.35)}
.swatch.sel{transform:scale(1.1);box-shadow:inset -6px -8px 0 rgba(0,0,0,.12),inset 6px 6px 0 rgba(255,255,255,.35),0 0 0 4px #fff,0 0 0 8px var(--plum)}
@media (orientation:portrait){
  .dock{grid-template-columns:minmax(0,1fr)}
  .fx{justify-content:center}
  .fxb{flex:1;max-width:150px;width:auto}
}

/* ===== 자석 퍼즐 ===== */
.fridge{--ps:clamp(80px,min(14vmin,16vh),146px);flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:14px;padding:18px;
  border:5px solid var(--plum);border-radius:36px;background:linear-gradient(160deg,#E8FBF5,#C3EFE0);
  box-shadow:inset 0 0 0 10px rgba(255,255,255,.55),0 8px 0 rgba(75,42,115,.35)}
.pz-top{display:flex;align-items:center;justify-content:center;gap:clamp(16px,3vw,44px);flex-wrap:wrap;position:relative;z-index:1}
.pz-pic{position:relative;width:calc(var(--ps)*1.3);height:calc(var(--ps)*1.3);font-size:calc(var(--ps)*.92);line-height:1;display:grid;place-items:center;background:#fff;border:4px solid var(--plum);border-radius:30px;transform:rotate(-4deg);box-shadow:0 6px 0 rgba(75,42,115,.3)}
.pz-pic::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-13px;width:26px;height:26px;border-radius:50%;background:var(--berry);border:4px solid var(--plum)}
.slots{display:flex;gap:14px;padding:14px;background:rgba(255,255,255,.85);border:4px dashed var(--plum-soft);border-radius:30px}
.slot{position:relative;width:var(--ps);height:var(--ps);border-radius:24px;background:#F3ECFF;border:3px dashed var(--plum-soft);display:grid;place-items:center;transition:background .15s,transform .15s}
.slot .ghost{font-size:calc(var(--ps)*.62);font-weight:900;color:rgba(75,42,115,.17);line-height:1}
.slot.hot{background:#FFF1B8;transform:scale(1.06)}
.slot.filled{border-color:transparent;background:transparent}
.slot.shake{animation:shake .42s}
.slots.wave .slot{animation:jump .5s ease-out both}
.slots.wave .slot:nth-child(2){animation-delay:.12s}
.slots.wave .slot:nth-child(3){animation-delay:.24s}
.tray{flex:1;min-height:0;position:relative}
.piece{position:absolute;z-index:2;width:var(--ps);height:var(--ps);border-radius:24px;display:grid;place-items:center;
  font-size:calc(var(--ps)*.6);font-weight:900;line-height:1;color:#fff;background:var(--c);border:4px solid var(--plum);
  box-shadow:0 7px 0 var(--plum);transform:rotate(var(--r));touch-action:none;text-shadow:0 3px 0 rgba(75,42,115,.5);will-change:transform}
.piece::after{content:"";position:absolute;left:12%;top:8%;width:44%;height:20%;border-radius:999px;background:rgba(255,255,255,.5);pointer-events:none}
.piece.in{animation:pin .4s cubic-bezier(.3,1.6,.5,1) both}
.piece.drag{z-index:60;transition:none;box-shadow:0 18px 0 rgba(75,42,115,.35)}
.piece.back{transition:transform .38s cubic-bezier(.3,1.5,.5,1)}
.slot .piece{left:-3px;top:-3px;width:calc(100% + 6px);height:calc(100% + 6px);transform:none;animation:snap .35s cubic-bezier(.3,1.7,.5,1)}
@keyframes pin{from{opacity:0;scale:.3}to{opacity:1;scale:1}}
@keyframes snap{0%{scale:1.3}100%{scale:1}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-4deg)}}
@keyframes shake{0%,100%{translate:0}20%{translate:-10px}40%{translate:10px}60%{translate:-7px}80%{translate:6px}}

/* ===== 짝 맞추기 ===== */
.mt-board{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:1fr minmax(70px,.9fr) 1fr;padding:clamp(12px,2.2vw,26px);
  border:5px solid var(--plum);border-radius:36px;background:repeating-linear-gradient(0deg,#FFF6FB 0 30px,#FFEEF7 30px 60px);
  box-shadow:0 8px 0 rgba(75,42,115,.35);touch-action:none}
.mt-col{display:flex;flex-direction:column;justify-content:space-around;gap:clamp(12px,2.4vh,24px);min-height:0}
#mLeft{grid-column:1}#mRight{grid-column:3}
.mcard{position:relative;flex:1;max-height:220px;min-height:0;display:grid;place-items:center;border:4px solid var(--plum);border-radius:28px;background:#fff;box-shadow:0 6px 0 var(--plum);transition:background .2s,border-color .2s,transform .1s}
.mcard.mpic{font-size:clamp(56px,10vmin,112px);line-height:1}
.mcard.word{font-size:clamp(34px,6.2vmin,66px);font-weight:900;background:var(--c);color:var(--plum)}
.mcard .dot{position:absolute;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:50%;background:var(--pink);border:4px solid var(--plum);transition:background .2s}
#mLeft .dot{right:-19px}#mRight .dot{left:-19px}
.mcard.on{transform:scale(1.04);background:#FFF1B8}
.mcard.word.on{background:#FFF1B8}
.mcard.done{background:#E3FBEA;border-color:var(--ok);box-shadow:0 6px 0 var(--ok)}
.mcard.done .dot{background:var(--ok);border-color:#127a3f}
.mcard.wrong{animation:shake .45s}
.mt-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5}
.mt-lines line{stroke-width:11;stroke-linecap:round}
.mt-lines .live line{stroke:var(--plum);stroke-dasharray:2 18}
.mt-lines .live circle{fill:var(--plum)}
.mt-lines .ok line{stroke:var(--ok)}
.mt-lines .ok circle{fill:var(--ok)}
.mt-lines .bad line{stroke:var(--bad)}
.mt-lines .bad circle{fill:var(--bad)}
.mt-lines .bad{animation:fade .7s ease-in forwards}
@keyframes fade{0%,55%{opacity:1}100%{opacity:0}}

/* ===== 보상 ===== */
.reward{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;
  background:rgba(240,226,255,.42);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);animation:fadein .3s ease-out}
.reward canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rw-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,14px);padding:16px}
.rw-bubble{position:relative;background:#fff;border:5px solid var(--plum);border-radius:999px;padding:.28em 1em;font-size:clamp(26px,4.6vmin,46px);font-weight:900;box-shadow:0 7px 0 var(--plum);animation:pop .5s .25s cubic-bezier(.3,1.6,.5,1) both;text-align:center}
.rw-bubble::after{content:"";position:absolute;left:50%;bottom:-20px;margin-left:-14px;border:14px solid transparent;border-top:16px solid var(--plum)}
.rw-cat{width:min(44vh,62vw,430px);animation:catin .75s cubic-bezier(.3,1.5,.5,1) both}
.rw-word{display:flex;align-items:center;gap:.4em;flex-wrap:wrap;justify-content:center;background:var(--sun);border:5px solid var(--plum);border-radius:28px;padding:.15em .8em;font-size:clamp(30px,6vmin,62px);font-weight:900;box-shadow:0 7px 0 var(--plum);animation:pop .5s .5s cubic-bezier(.3,1.6,.5,1) both;max-width:92vw}
.rw-btns{display:flex;gap:16px;margin-top:6px;opacity:0;pointer-events:none;transition:opacity .4s}

const COMPLETE_RATIO = 0.88;   // 색칠 완성 기준(글자 영역의 88% 이상)

(() => {
'use strict';
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const syl = w => Array.from(w);
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const FONT = '"Apple SD Gothic Neo","AppleSDGothicNeo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif';

/* ---------- 중복 없는 출제 덱 ---------- */
function Deck(filter){
  const pool = WORDS.filter(filter);
  let bag = [], last = null;
  return {
    take(){
      if (!bag.length){
        bag = shuffle(pool.slice());
        if (last && bag.length > 1 && bag[bag.length-1] === last) [bag[0], bag[bag.length-1]] = [bag[bag.length-1], bag[0]];
      }
      last = bag.pop();
      return last;
    },
    takeN(n, ok){
      const out = []; let guard = 0;
      while (out.length < n && guard++ < 600){
        const w = this.take();
        if (out.includes(w) || (ok && !ok(w, out))) continue;
        out.push(w);
      }
      return out;
    }
  };
}

/* ---------- 색 도우미 ---------- */
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mix(h, t, to=[255,255,255]){ const c=hexRgb(h); return `rgb(${c.map((v,i)=>Math.round(v+(to[i]-v)*t)).join(',')})`; }

/* ================================================================
   소리 (Web Audio)
   ================================================================ */
const Snd = {
  ctx:null, out:null,
  unlock(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!this.ctx){
        this.ctx = new AC();
        const comp = this.ctx.createDynamicsCompressor();
        this.out = this.ctx.createGain(); this.out.gain.value = .6;
        this.out.connect(comp); comp.connect(this.ctx.destination);
      }
      if (this.ctx.state !== 'running') this.ctx.resume();
      const b = this.ctx.createBuffer(1,1,22050), s = this.ctx.createBufferSource();
      s.buffer = b; s.connect(this.ctx.destination); s.start(0);
    }catch(e){}
  },
  note(f, t=0, d=.25, o={}){
    if (!this.ctx) return;
    try{
      const c=this.ctx, T=c.currentTime+t, osc=c.createOscillator(), g=c.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, T);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, T + (o.slide || d));
      const v = o.vol == null ? .3 : o.vol;
      g.gain.setValueAtTime(.0001, T);
      g.gain.exponentialRampToValueAtTime(v, T + (o.a || .008));
      g.gain.exponentialRampToValueAtTime(.0001, T + d);
      osc.connect(g); g.connect(this.out); osc.start(T); osc.stop(T + d + .05);
    }catch(e){}
  },
  bell(f, t=0, d=.6, v=.25){ this.note(f,t,d,{vol:v}); this.note(f*2,t,d*.6,{vol:v*.3}); this.note(f*3.01,t,d*.35,{vol:v*.1}); },
  pop(){ this.note(520,0,.12,{to:900,slide:.08,vol:.22,type:'triangle'}); },
  pick(){ this.note(640,0,.13,{to:980,vol:.2,type:'triangle'}); },
  snap(){ this.note(900,0,.06,{vol:.18,type:'square'}); this.bell(1320,.04,.32,.2); },
  thunk(){ this.note(240,0,.1,{to:160,vol:.2,type:'triangle'}); },
  boing(){ this.note(320,0,.32,{to:170,vol:.22,type:'triangle'}); },
  xylo(i){ const sc=[523,587,659,784,880,1047,1175,1319,1568,1760,2093]; this.bell(sc[i % sc.length], 0, .5, .22); },
  dingdong(){ this.bell(784,0,.5,.3); this.bell(659,.2,.5,.3); this.bell(1047,.4,1,.32); },
  ttaeng(){ this.note(233,0,.36,{type:'triangle',vol:.26,to:196}); this.note(116,0,.36,{vol:.16}); },
  sparkle(){ for (let i=0;i<5;i++) this.bell(1500+Math.random()*1500, i*.06, .28, .07); },
  fanfare(){
    [523,659,784,1047].forEach((f,i)=>this.bell(f, i*.12, .5, .26));
    this.bell(1319,.52,1.2,.26); this.bell(1568,.52,1.2,.16);
    for (let i=0;i<8;i++) this.bell(1800+Math.random()*1600, .75+i*.09, .3, .07);
  },
  clap(t=0){
    if (!this.ctx) return;
    try{
      const c=this.ctx, T=c.currentTime+t, len=Math.floor(c.sampleRate*.12);
      const b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
      for (let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,5);
      const s=c.createBufferSource(); s.buffer=b;
      const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500; f.Q.value=.7;
      const g=c.createGain(); g.gain.value=.55;
      s.connect(f); f.connect(g); g.connect(this.out); s.start(T);
    }catch(e){}
  },
  meow(){
    if (!this.ctx) return;
    try{
      const c=this.ctx, T=c.currentTime, o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain();
      o.type='sawtooth';
      o.frequency.setValueAtTime(560,T); o.frequency.linearRampToValueAtTime(860,T+.16); o.frequency.linearRampToValueAtTime(520,T+.5);
      f.type='bandpass'; f.Q.value=3; f.frequency.setValueAtTime(900,T); f.frequency.linearRampToValueAtTime(1600,T+.18); f.frequency.linearRampToValueAtTime(800,T+.5);
      g.gain.setValueAtTime(.0001,T); g.gain.exponentialRampToValueAtTime(.35,T+.05); g.gain.exponentialRampToValueAtTime(.0001,T+.55);
      o.connect(f); f.connect(g); g.connect(this.out); o.start(T); o.stop(T+.6);
    }catch(e){}
  }
};

/* ================================================================
   한국어 음성 (speechSynthesis)
   ================================================================ */
const Voice = {
  s: ('speechSynthesis' in window) ? window.speechSynthesis : null,
  v:null, gen:0, inited:false, pollT:0,
  RATE:.9, PITCH:1.1,          // 유아 친화 속도(0.88~0.92) · 음높이(1.08~1.12)
  isKo(v){ return /^ko([-_]|$)/i.test(v.lang || '') || /korean|한국/i.test(v.name || ''); },
  pick(){
    if (!this.s) return false;
    let vs = [];
    try{ vs = this.s.getVoices() || []; }catch(e){}
    const ko = vs.filter(v => this.isKo(v));
    if (!ko.length){ this.v = null; return false; }
    const score = v => {
      const n = (v.name || '') + ' ' + (v.voiceURI || '');
      let s = 0;
      if (/premium|프리미엄/i.test(n)) s += 60;
      if (/enhanced|향상/i.test(n)) s += 50;
      if (/natural|neural|online/i.test(n)) s += 40;
      if (/yuna|유나/i.test(n)) s += 30;
      if (/sora|소라/i.test(n)) s += 26;
      if (/google\s*한국의|google.*korean/i.test(n)) s += 24;
      if (/siri/i.test(n)) s += 20;
      if (/jian|heami|sunhi|injoon/i.test(n)) s += 8;
      if (/^ko[-_]KR$/i.test(v.lang || '')) s += 5;
      if (v.default) s += 3;
      if (/compact|eloquence|grandma|grandpa|rocko|shelley|flo|reed|sandy|eddy/i.test(n)) s -= 40;
      return s;
    };
    ko.sort((a, b) => score(b) - score(a));
    this.v = ko[0];           // 선호 음성이 없으면 기본 한국어 음성
    return true;
  },
  init(){
    if (!this.s || this.inited) return;
    this.inited = true;
    const on = () => this.pick();
    // iOS Safari: getVoices()가 늦게 채워지므로 이벤트 + 폴백 타이머로 재시도
    try{ this.s.onvoiceschanged = on; }catch(e){}
    try{ this.s.addEventListener('voiceschanged', on); }catch(e){}
    let tries = 0;
    const poll = () => {
      if (this.pick() || ++tries > 20) return;   // 약 5초까지 재시도
      this.pollT = setTimeout(poll, 250);
    };
    poll();
  },
  say(text, o={}){
    if (!o._seq) this.gen++;
    const myGen = this.gen;
    return new Promise(res => {
      if (!this.s || !text){ res(); return; }
      if (!this.v) this.pick();
      let done = false, tm = 0;
      const fin = () => { if (done) return; done = true; clearTimeout(tm); res(); };
      const clean = String(text).replace(/\s+/g, ' ').trim();
      const go = () => {
        if (o._seq ? false : myGen !== this.gen){ fin(); return; }
        try{
          if (this.s.paused) this.s.resume();
          const u = new SpeechSynthesisUtterance(clean);   // 단어 전체를 한 번에
          u.lang = (this.v && this.v.lang) ? this.v.lang : 'ko-KR';
          if (this.v) u.voice = this.v;
          u.rate = this.RATE; u.pitch = this.PITCH; u.volume = 1;
          u.onend = fin; u.onerror = fin;
          tm = setTimeout(fin, 1800 + clean.length * 450);  // 음성이 막혀도 앱은 계속
          this.s.speak(u);
          if (this.s.paused) this.s.resume();
        }catch(e){ fin(); }
      };
      try{
        const busy = this.s.speaking || this.s.pending;
        if (!o.queue){
          this.s.cancel();                // 새 음성 전에 이전 음성 정리(중복 방지)
          if (this.s.paused) this.s.resume();
        }
        // iOS는 cancel 직후 바로 speak 하면 소리가 씹히는 경우가 있어 아주 잠깐 쉬고 재생
        if (!o.queue && busy) setTimeout(go, 70); else go();
      }catch(e){ fin(); }
    });
  },
  async seq(list, o={}){
    const g = ++this.gen;
    for (let i=0;i<list.length;i++){
      if (g !== this.gen) return;
      await this.say(list[i], Object.assign({}, o, {_seq:true, queue:i>0}));
      if (g !== this.gen) return;
      await sleep(o.gap == null ? 160 : o.gap);
    }
  },
  stop(){ this.gen++; try{ if (this.s){ this.s.cancel(); if (this.s.paused) this.s.resume(); } }catch(e){} }
};

/* ================================================================
   보상 연출 + 반짝이
   ================================================================ */
const Confetti = {
  c: $('#fx'), ctx:null, parts:[], run:false, t0:0,
  size(){ const d=Math.min(window.devicePixelRatio||1,2); this.d=d; this.c.width=innerWidth*d; this.c.height=innerHeight*d; this.ctx=this.c.getContext('2d'); },
  burst(n){
    const W=innerWidth, H=innerHeight;
    const cols=['#FF7EB8','#FFC93C','#4FD6B4','#6CC4FF','#B79CFF','#FF8A5B','#ffffff'];
    for (let i=0;i<n;i++){
      const a=rnd(0,Math.PI*2), sp=rnd(5,15);
      this.parts.push({k:pick(['star','heart','dot','rib','star']), x:W/2+rnd(-40,40), y:H*.45+rnd(-30,30),
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-rnd(3,8), r:rnd(7,15), rot:rnd(0,6), vr:rnd(-.2,.2), c:pick(cols), life:rnd(150,240), age:0});
    }
  },
  twinkle(){
    this.parts.push({k:'tw', x:rnd(0,innerWidth), y:rnd(0,innerHeight), r:rnd(8,18), c:pick(['#FFE066','#ffffff','#FFB3D9']), life:60, age:0, vx:0, vy:0, rot:0, vr:0});
  },
  start(){ this.size(); this.parts=[]; this.burst(140); setTimeout(()=>this.run&&this.burst(70),900); this.run=true; this.t0=performance.now(); this.loop(); },
  stop(){ this.run=false; this.parts=[]; if (this.ctx) this.ctx.clearRect(0,0,this.c.width,this.c.height); },
  star(x,r,sp){ x.beginPath(); for (let i=0;i<10;i++){ const rr = i%2 ? r*.45 : r; const a=i*Math.PI/5 - Math.PI/2; x.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } x.closePath(); },
  loop(){
    if (!this.run) return;
    const x=this.ctx, d=this.d;
    x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,this.c.width,this.c.height);
    if (Math.random()<.35) this.twinkle();
    if (performance.now()-this.t0 < 9000 && Math.random()<.04) this.burst(18);
    this.parts = this.parts.filter(p => p.age < p.life);
    for (const p of this.parts){
      p.age++;
      if (p.k !== 'tw'){ p.vy += .28; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; }
      const fade = Math.min(1, (p.life-p.age)/30);
      x.setTransform(d,0,0,d,p.x*d,p.y*d); x.rotate(p.rot); x.globalAlpha = fade;
      x.fillStyle = p.c; x.strokeStyle = '#4B2A73'; x.lineWidth = 2.5;
      if (p.k==='star'){ this.star(x,p.r); x.fill(); x.stroke(); }
      else if (p.k==='heart'){ const r=p.r; x.beginPath(); x.moveTo(0,r*.35); x.bezierCurveTo(-r*1.2,-r*.4,-r*.5,-r*1.2,0,-r*.45); x.bezierCurveTo(r*.5,-r*1.2,r*1.2,-r*.4,0,r*.35); x.fill(); x.stroke(); }
      else if (p.k==='dot'){ x.beginPath(); x.arc(0,0,p.r*.55,0,7); x.fill(); x.stroke(); }
      else if (p.k==='rib'){ x.fillRect(-p.r*.9,-p.r*.3,p.r*1.8,p.r*.6); x.strokeRect(-p.r*.9,-p.r*.3,p.r*1.8,p.r*.6); }
      else { const s = Math.sin(p.age/p.life*Math.PI); x.scale(s,s); x.beginPath(); x.moveTo(0,-p.r); x.quadraticCurveTo(0,0,p.r,0); x.quadraticCurveTo(0,0,0,p.r); x.quadraticCurveTo(0,0,-p.r,0); x.quadraticCurveTo(0,0,0,-p.r); x.fill(); }
    }
    x.globalAlpha = 1;
    requestAnimationFrame(() => this.loop());
  }
};

const Coloring = {
  deck: Deck(w => syl(w.w).length <= 4),
  colorIdx: 11, fx: 'crayon', pats:{}, ptrs:new Map(), lastCheck:0,
  init(){
    this.stage=$('#cStage'); this.wrap=$('#cWrap'); this.base=$('#cvBase'); this.paint=$('#cvPaint');
    this.bctx=this.base.getContext('2d'); this.pctx=this.paint.getContext('2d');
    this.cov=document.createElement('canvas');
    this.cctx=this.cov.getContext('2d', {willReadFrequently:true});
    this.stars=[...document.querySelectorAll('#cStars span')];

    // 색 팔레트 (좌우로 밀어서 보기)
    const sw = $('#cSwatches');
    COLORS.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'swatch' + (i===this.colorIdx ? ' sel' : '');
      b.style.background = c.c; b.setAttribute('aria-label', c.n);
      b.addEventListener('click', () => this.setColor(i));
      sw.appendChild(b);
    });
    document.documentElement.style.setProperty('--cur', COLORS[this.colorIdx].c);
    $('#palL').addEventListener('click', () => { Snd.pop(); sw.scrollBy({left:-sw.clientWidth*.7, behavior:'smooth'}); });
    $('#palR').addEventListener('click', () => { Snd.pop(); sw.scrollBy({left: sw.clientWidth*.7, behavior:'smooth'}); });

    const fxNames = {crayon:'크레파스', sparkle:'반짝반짝', rainbow:'무지개', gloss:'윤기 반짝'};
    document.querySelectorAll('#cFx .fxb').forEach(b => b.addEventListener('click', () => {
      this.fx = b.dataset.fx;
      document.querySelectorAll('#cFx .fxb').forEach(x => x.classList.toggle('sel', x === b));
      Snd.pop(); Voice.say(fxNames[this.fx]);
    }));
    $('#cClear').addEventListener('click', () => { Snd.boing(); if (!this.done){ this.resetPaint(); this.setStars(0); } });
    $('#cNext').addEventListener('click', () => { Snd.pop(); this.start(); });
    $('#cPic').addEventListener('click', () => { Snd.pop(); this.word && Voice.say(this.word.w); });

    const p = this.paint;
    p.addEventListener('pointerdown', e => {
      if (this.done) return;
      e.preventDefault();
      try{ p.setPointerCapture(e.pointerId); }catch(_){}
      const q = this.pos(e);
      const st = {x:q.x, y:q.y, d:0, h0:rnd(0,360)};
      this.ptrs.set(e.pointerId, st);
      this.seg(st, q, e);
    });
    p.addEventListener('pointermove', e => {
      const st = this.ptrs.get(e.pointerId);
      if (!st || this.done) return;
      const list = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
      for (const ev of list){ const q = this.pos(ev); this.seg(st, q, ev); st.x = q.x; st.y = q.y; }
      const now = performance.now();
      if (now - this.lastCheck > 280){ this.lastCheck = now; this.check(); }
    });
    const end = e => {
      const st = this.ptrs.get(e.pointerId);
      if (!st) return;
      this.ptrs.delete(e.pointerId);
      if (this.fx === 'sparkle' && !this.done) this.sparkleBurst(st.x, st.y, this.brush(e));
      this.check();
    };
    p.addEventListener('pointerup', end);
    p.addEventListener('pointercancel', end);
  },
  setColor(i){
    this.colorIdx = i;
    document.querySelectorAll('#cSwatches .swatch').forEach((b, j) => b.classList.toggle('sel', j === i));
    document.documentElement.style.setProperty('--cur', COLORS[i].c);
    Snd.xylo(i); Voice.say(COLORS[i].n);
    if (this.fx === 'rainbow'){ // 무지개에서 색을 고르면 크레파스로 자연스럽게 전환
      this.fx = 'crayon';
      document.querySelectorAll('#cFx .fxb').forEach(x => x.classList.toggle('sel', x.dataset.fx === 'crayon'));
    }
  },
  start(){
    this.word = this.deck.take();
    this.done = false; this.painted = false; this.ptrs.clear();
    $('#cPic').textContent = this.word.e;
    this.setup();
    this.setStars(0);
    Voice.say(`${this.word.w}! 예쁘게 색칠해 볼까?`);
  },
  setup(){
    const r = this.stage.getBoundingClientRect();
    const cssW = Math.max(120, r.width - 10), cssH = Math.max(120, r.height - 14);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let W = Math.round(cssW*dpr), H = Math.round(cssH*dpr);
    const MAXPX = 4200000;
    if (W*H > MAXPX){ const k = Math.sqrt(MAXPX/(W*H)); W = Math.round(W*k); H = Math.round(H*k); }
    this.base.width = this.paint.width = W; this.base.height = this.paint.height = H;
    this.W = W; this.H = H;
    this.layoutGlyph();
    this.drawBase();
    this.resetPaint();
    this.fit();
  },
  fit(){
    if (!this.W) return;
    const r = this.stage.getBoundingClientRect();
    const aw = Math.max(50, r.width - 10), ah = Math.max(50, r.height - 14), a = this.W/this.H;
    let w, h;
    if (aw/ah > a){ h = ah; w = h*a; } else { w = aw; h = w/a; }
    this.wrap.style.width = Math.floor(w) + 'px';
    this.wrap.style.height = Math.floor(h) + 'px';
  },
  layoutGlyph(){
    // 단어는 항상 가로 한 줄. 글자 수가 많거나 폭이 좁으면 글자 크기를 자동으로 줄임
    const ch = syl(this.word.w), W = this.W, H = this.H, c = this.bctx;
    const GAP = .06;        // 글자 사이 간격(글자 크기 대비)
    const OUT = .035 + .065 + .04;  // 살 찌우기 + 테두리 + 그림자 여유(글자 크기 대비)
    const measure = f => {
      c.font = `900 ${f}px ${FONT}`;
      return ch.map(k => {
        const m = c.measureText(k);
        const Lb = m.actualBoundingBoxLeft || 0, Rb = m.actualBoundingBoxRight || m.width;
        return { L:Lb, R:Rb, w:Lb + Rb, A:m.actualBoundingBoxAscent || f*.8, D:m.actualBoundingBoxDescent || f*.05 };
      });
    };
    const rowSize = (ms, f) => {
      const w = ms.reduce((s, m) => s + m.w, 0) + f*GAP*(ms.length - 1) + f*OUT*2;
      const top = Math.max(...ms.map(m => m.A)), bot = Math.max(...ms.map(m => m.D));
      return { w, h: top + bot + f*OUT*2, top, bot };
    };
    // 기준 크기에서 한 줄 전체 폭·높이를 재고, 캔버스 안에 들어가도록 비례 축소
    let fs = Math.min(H * .8, W * .8);
    let ms = measure(fs), sz = rowSize(ms, fs);
    fs *= Math.min((W * .92) / sz.w, (H * .86) / sz.h);
    fs = Math.max(8, fs);
    ms = measure(fs); sz = rowSize(ms, fs);
    // 한 줄 가운데 정렬
    let x = (W - (sz.w - fs*OUT*2)) / 2;
    const baseY = H/2 + (sz.top - sz.bot) / 2;
    const items = ch.map((k, i) => {
      const m = ms[i], it = { ch:k, x: x + m.L, y: baseY };
      x += m.w + fs*GAP;
      return it;
    });
    this.g = { fs, items, F: fs*.035 };
  },
  glyph(ctx, fill, sw, stroke){
    const g = this.g;
    ctx.font = `900 ${g.fs}px ${FONT}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    g.items.forEach(it => {
      if (sw){ ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(it.ch, it.x, it.y); }
      if (fill){ ctx.fillStyle = fill; ctx.fillText(it.ch, it.x, it.y); }
    });
  },
  drawBase(){
    const c = this.bctx, g = this.g, O = g.F + g.fs*.065;
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,this.W,this.H);
    c.save(); c.translate(0, g.fs*.04); this.glyph(c, 'rgba(75,42,115,.22)', O, 'rgba(75,42,115,.22)'); c.restore();
    this.glyph(c, '#4B2A73', O, '#4B2A73');
  },
  resetPaint(){
    const c = this.pctx, g = this.g;
    c.setTransform(1,0,0,1,0,0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    c.clearRect(0,0,this.W,this.H);
    this.glyph(c, '#ffffff', g.F, '#ffffff');
    // 글자 안쪽 도화지 점무늬
    c.globalCompositeOperation = 'source-atop'; c.fillStyle = '#F2EAFF';
    const step = Math.max(14, g.fs*.07);
    for (let y = step/2; y < this.H; y += step) for (let x = ((y/step)%2 ? step/2 : 0); x < this.W; x += step){ c.beginPath(); c.arc(x, y, step*.13, 0, 7); c.fill(); }
    c.globalCompositeOperation = 'source-over';
    // 완성 판정용 저해상도 마스크
    const S = 6;
    this.cov.width = Math.ceil(this.W/S); this.cov.height = Math.ceil(this.H/S);
    this.cs = this.cov.width / this.W;
    const k = this.cctx;
    k.setTransform(1,0,0,1,0,0); k.globalCompositeOperation = 'source-over'; k.clearRect(0,0,this.cov.width,this.cov.height);
    k.setTransform(this.cs,0,0,this.cs,0,0);
    this.glyph(k, '#ff0000', g.F, '#ff0000');
    const d = k.getImageData(0,0,this.cov.width,this.cov.height).data;
    let tot = 0; for (let i=3;i<d.length;i+=4) if (d[i] > 200) tot++;
    this.total = tot; this.painted = false;
  },
  pos(e){
    const r = this.paint.getBoundingClientRect();
    return { x:(e.clientX - r.left) * this.W / r.width, y:(e.clientY - r.top) * this.H / r.height };
  },
  brush(e){
    let w = this.g.fs * .2;
    if (e && e.pointerType === 'pen' && e.pressure > 0) w *= .75 + .55*e.pressure;
    return w;
  },
  crayon(col){
    if (this.pats[col]) return this.pats[col];
    const s = document.createElement('canvas'); s.width = s.height = 96;
    const x = s.getContext('2d');
    x.fillStyle = col; x.fillRect(0,0,96,96);
    for (let i=0;i<520;i++){
      x.fillStyle = Math.random() < .62 ? `rgba(255,255,255,${rnd(.18,.55)})` : `rgba(0,0,0,${rnd(.04,.12)})`;
      x.fillRect(Math.random()*96, Math.random()*96, rnd(1.5,4.5), rnd(1.2,3));
    }
    x.strokeStyle = 'rgba(255,255,255,.22)'; x.lineWidth = 1.5;
    for (let i=0;i<26;i++){ const y = Math.random()*120; x.beginPath(); x.moveTo(0,y); x.lineTo(96,y-34); x.stroke(); }
    return (this.pats[col] = this.pctx.createPattern(s, 'repeat'));
  },
  starShape(c, x, y, r){
    c.beginPath(); c.moveTo(x, y-r);
    c.quadraticCurveTo(x, y, x+r, y); c.quadraticCurveTo(x, y, x, y+r);
    c.quadraticCurveTo(x, y, x-r, y); c.quadraticCurveTo(x, y, x, y-r); c.fill();
  },
  sparkleBurst(x, y, w){
    const c = this.pctx; c.save(); c.globalCompositeOperation = 'source-atop';
    for (let i=0;i<4;i++){ c.fillStyle = pick(['#ffffff','#FFF6B0','#FFE066']); this.starShape(c, x+rnd(-w*.5,w*.5), y+rnd(-w*.5,w*.5), w*rnd(.12,.24)); }
    c.restore();
  },
  seg(a, b, ev){
    const c = this.pctx, w = this.brush(ev), col = COLORS[this.colorIdx].c;
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    c.save();
    c.globalCompositeOperation = 'source-atop';   // 글자 안쪽에만 칠해짐
    c.lineCap = 'round'; c.lineJoin = 'round';
    const line = () => { c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x + (len ? 0 : .01), b.y); c.stroke(); };
    if (this.fx === 'crayon'){
      c.globalAlpha = .92; c.strokeStyle = this.crayon(col); c.lineWidth = w; line();
    } else if (this.fx === 'rainbow'){
      a.d = (a.d || 0) + len;
      const hue = (a.d * .22 + (a.h0 || 0)) % 360;
      c.strokeStyle = `hsl(${hue},95%,62%)`; c.lineWidth = w; line();
    } else if (this.fx === 'sparkle'){
      c.strokeStyle = col; c.lineWidth = w; line();
      c.strokeStyle = mix(col, .3); c.lineWidth = w*.5; c.globalAlpha = .55; line(); c.globalAlpha = 1;
      // 반짝이는 이미 지나간 자리(뒤쪽)에 뿌려서 다음 붓질에 덮이지 않게
      if (len > 0 && Math.random() < Math.min(1, len/(w*.7))){
        const ux = dx/len, uy = dy/len, back = w*rnd(.9,1.4), side = rnd(-w*.45, w*.45);
        const sx = b.x - ux*back - uy*side, sy = b.y - uy*back + ux*side;
        c.fillStyle = pick(['#ffffff','#FFF6B0','#FFE066','#ffffff']);
        this.starShape(c, sx, sy, w*rnd(.12,.26));
        c.fillStyle = 'rgba(255,255,255,.9)';
        c.beginPath(); c.arc(sx + rnd(-w*.3,w*.3), sy + rnd(-w*.3,w*.3), w*.04, 0, 7); c.fill();
      }
    } else { // gloss: 젤리 튜브처럼 볼록한 도장을 촘촘히
      const sp = Math.max(2, w*.12), n = Math.max(1, Math.ceil(len/sp));
      const light = mix(col, .5), dark = mix(col, .2, [0,0,0]);
      for (let i=1;i<=n;i++){
        const x = a.x + dx*i/n, y = a.y + dy*i/n;
        const gr = c.createRadialGradient(x - w*.17, y - w*.17, w*.04, x, y, w/2);
        gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(.28, light); gr.addColorStop(.65, col); gr.addColorStop(1, dark);
        c.fillStyle = gr; c.beginPath(); c.arc(x, y, w/2, 0, 7); c.fill();
      }
    }
    c.restore();
    // 완성 판정 마스크에도 같은 붓질
    const k = this.cctx;
    k.save(); k.setTransform(this.cs,0,0,this.cs,0,0);
    k.globalCompositeOperation = 'source-atop'; k.strokeStyle = '#0000ff'; k.lineWidth = w; k.lineCap = 'round';
    k.beginPath(); k.moveTo(a.x, a.y); k.lineTo(b.x + (len ? 0 : .01), b.y); k.stroke();
    k.restore();
    this.painted = true;
  },
  ratio(){
    if (!this.total) return 0;
    const d = this.cctx.getImageData(0,0,this.cov.width,this.cov.height).data;
    let p = 0;
    for (let i=0;i<d.length;i+=4) if (d[i+3] > 200 && d[i+2] > 140 && d[i] < 120) p++;
    return p / this.total;
  },
  setStars(r){
    const n = Math.min(5, Math.floor(r / COMPLETE_RATIO * 5 + 1e-6));
    this.stars.forEach((s, i) => {
      const on = i < n;
      if (on && !s.classList.contains('on')) Snd.bell(880 + i*120, 0, .25, .12);
      s.classList.toggle('on', on);
    });
  },
  check(){
    if (this.done || !this.painted) return;
    const r = this.ratio();
    this.setStars(r);
    if (r >= COMPLETE_RATIO){
      this.done = true; this.ptrs.clear();
      Snd.sparkle();
      this.wrap.classList.remove('shine'); void this.wrap.offsetWidth; this.wrap.classList.add('shine');
      setTimeout(() => Reward.show([this.word], () => this.start()), 650);
    }
  },
  onResize(){
    if (current !== 'scr-color' || !this.word) return;
    if (!this.painted && !this.done) this.setup(); else this.fit();
  }
};

/* ================================================================
   2. 자석 퍼즐
   ================================================================ */
const Puzzle = {
  deck: Deck(w => { const n = syl(w.w).length; return n >= 2 && n <= 3; }),
  init(){
    this.slots=$('#pSlots'); this.tray=$('#pTray');
    $('#pPic').addEventListener('click', () => { Snd.pop(); this.word && Voice.say(this.word.w); });
    $('#pNext').addEventListener('click', () => { Snd.pop(); this.start(); });
  },
  start(){
    this.word = this.deck.take(); this.done = false;
    const ch = syl(this.word.w);
    $('#pPic').textContent = this.word.e;
    this.slots.classList.remove('wave');
    this.slots.innerHTML = '';
    ch.forEach(k => {
      const s = document.createElement('div');
      s.className = 'slot'; s.dataset.ch = k;
      s.innerHTML = `<span class="ghost">${k}</span>`;
      this.slots.appendChild(s);
    });
    // 헷갈리는 조각 2개 추가
    const own = new Set(ch), pool = [];
    WORDS.forEach(w => syl(w.w).forEach(k => { if (!own.has(k)) pool.push(k); }));
    shuffle(pool);
    const extra = [];
    for (const k of pool){ if (!extra.includes(k)) extra.push(k); if (extra.length >= 2) break; }
    const all = shuffle([...ch, ...extra]);
    this.tray.innerHTML = '';
    all.forEach((k, i) => {
      const p = document.createElement('div');
      p.className = 'piece'; p.textContent = k; p.dataset.ch = k;
      p.style.setProperty('--c', MAGNET_COLORS[i % MAGNET_COLORS.length]);
      p.style.setProperty('--r', rnd(-9, 9).toFixed(1) + 'deg');
      this.tray.appendChild(p);
      this.bind(p);
    });
    requestAnimationFrame(() => this.scatter());
    Voice.say(`${this.word.w}! 글자 자석을 붙여 볼까?`);
  },
  scatter(){
    const pcs = [...this.tray.querySelectorAll('.piece')];
    if (!pcs.length) return;
    const tw = this.tray.clientWidth, th = this.tray.clientHeight, ps = pcs[0].offsetWidth || 100;
    let cols = Math.max(1, Math.floor(tw/(ps*1.3))), rows = Math.max(1, Math.floor(th/(ps*1.2)));
    while (cols*rows < pcs.length){ if (tw/cols > th/rows) cols++; else rows++; }
    const cw = tw/cols, chh = th/rows, cells = [];
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) cells.push([c,r]);
    shuffle(cells);
    pcs.forEach((p, i) => {
      const [c, r] = cells[i];
      let x = c*cw + (cw-ps)/2 + Math.max(0,(cw-ps)/2)*rnd(-.6,.6);
      let y = r*chh + (chh-ps)/2 + Math.max(0,(chh-ps)/2)*rnd(-.6,.6);
      x = Math.max(0, Math.min(tw-ps, x)); y = Math.max(0, Math.min(th-ps, y));
      p.style.left = (x/tw*100) + '%'; p.style.top = (y/th*100) + '%';
      p.style.animationDelay = (i*70) + 'ms';
      p.classList.add('in');
    });
  },
  bind(p){
    let st = null;
    p.addEventListener('pointerdown', e => {
      if (this.done || p.classList.contains('placed') || st) return;
      e.preventDefault();
      try{ p.setPointerCapture(e.pointerId); }catch(_){}
      st = { id:e.pointerId, x0:e.clientX, y0:e.clientY, l:p.offsetLeft, t:p.offsetTop, dx:0, dy:0 };
      p.classList.remove('back', 'in'); p.style.animationDelay = '';
      p.classList.add('drag');
      p.style.transform = 'translate(0px,0px) rotate(0deg) scale(1.12)';
      Snd.pick(); Voice.say(p.dataset.ch);
    });
    p.addEventListener('pointermove', e => {
      if (!st || e.pointerId !== st.id) return;
      st.dx = e.clientX - st.x0; st.dy = e.clientY - st.y0;
      p.style.transform = `translate(${st.dx}px,${st.dy}px) rotate(0deg) scale(1.12)`;
      this.hover(p);
    });
    const up = e => {
      if (!st || e.pointerId !== st.id) return;
      const s = st; st = null;
      p.classList.remove('drag');
      this.slots.querySelectorAll('.slot').forEach(x => x.classList.remove('hot'));
      this.drop(p, s);
    };
    p.addEventListener('pointerup', up);
    p.addEventListener('pointercancel', up);
  },
  near(p){
    const r = p.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    const out = [];
    this.slots.querySelectorAll('.slot').forEach(sl => {
      if (sl.querySelector('.piece')) return;
      const q = sl.getBoundingClientRect(), m = q.width*.5;
      if (cx > q.left-m && cx < q.right+m && cy > q.top-m && cy < q.bottom+m)
        out.push({ sl, d: Math.hypot(cx-(q.left+q.width/2), cy-(q.top+q.height/2)) });
    });
    return out.sort((a,b) => a.d - b.d);
  },
  hover(p){
    const n = this.near(p), hot = n.length ? n[0].sl : null;
    this.slots.querySelectorAll('.slot').forEach(x => x.classList.toggle('hot', x === hot));
  },
  drop(p, s){
    const cand = this.near(p);
    const good = cand.find(c => c.sl.dataset.ch === p.dataset.ch);
    if (good) return this.place(p, good.sl);
    if (cand.length){
      Snd.boing();
      const sl = cand[0].sl; sl.classList.remove('shake'); void sl.offsetWidth; sl.classList.add('shake');
      return this.back(p);
    }
    // 자석판 위 아무 곳에나 붙여 두기
    const tw = this.tray.clientWidth, th = this.tray.clientHeight, ps = p.offsetWidth;
    const nl = s.l + s.dx, nt = s.t + s.dy;
    const pr = p.getBoundingClientRect(), tr = this.tray.getBoundingClientRect();
    const cy = pr.top + pr.height/2;
    if (cy > tr.top - ps*.3 && cy < tr.bottom + ps*.3){
      p.style.left = (Math.max(0, Math.min(tw-ps, nl))/tw*100) + '%';
      p.style.top = (Math.max(0, Math.min(th-ps, nt))/th*100) + '%';
      p.style.transform = '';
      Snd.thunk();
    } else this.back(p);
  },
  back(p){
    p.classList.add('back'); p.style.transform = '';
    setTimeout(() => p.classList.remove('back'), 420);
  },
  place(p, sl){
    sl.appendChild(p);
    p.classList.add('placed'); p.style.left = ''; p.style.top = ''; p.style.transform = '';
    sl.classList.add('filled');
    Snd.snap(); Voice.say(p.dataset.ch);
    const all = [...this.slots.querySelectorAll('.slot')];
    if (all.every(x => x.querySelector('.piece'))){
      this.done = true;
      setTimeout(() => { this.slots.classList.add('wave'); Snd.dingdong(); Voice.say(this.word.w); }, 450);
      setTimeout(() => Reward.show([this.word], () => this.start()), 1700);
    }
  }
};

/* ================================================================
   3. 짝 맞추기 (선 긋기)
   ================================================================ */
const Match = {
  deck: Deck(w => syl(w.w).length <= 4),
  NS: 'http://www.w3.org/2000/svg',
  init(){
    this.board=$('#mBoard'); this.svg=$('#mLines'); this.L=$('#mLeft'); this.R=$('#mRight');
    $('#mNext').addEventListener('click', () => { Snd.pop(); this.start(); });
    const b = this.board;
    b.addEventListener('pointerdown', e => {
      if (this.done || this.drag) return;
      const card = e.target.closest('.mcard');
      if (!card || card.classList.contains('done')) return;
      e.preventDefault();
      try{ b.setPointerCapture(e.pointerId); }catch(_){}
      const a = this.pt(card), g = this.mkLine('live');
      this.setLine(g, a, a); this.svg.appendChild(g);
      this.drag = { id:e.pointerId, card, g, a };
      card.classList.add('on');
      Snd.pick();
      if (card.dataset.side === 'R') Voice.say(card.dataset.w);
    });
    b.addEventListener('pointermove', e => {
      const d = this.drag; if (!d || d.id !== e.pointerId) return;
      const r = this.svg.getBoundingClientRect();
      this.setLine(d.g, d.a, { x:e.clientX - r.left, y:e.clientY - r.top });
      const t = this.cardAt(e.clientX, e.clientY, d.card.dataset.side);
      this.board.querySelectorAll('.mcard').forEach(c => { if (c !== d.card) c.classList.toggle('on', c === t); });
    });
    const up = e => {
      const d = this.drag; if (!d || d.id !== e.pointerId) return;
      this.drag = null;
      this.board.querySelectorAll('.mcard').forEach(c => c.classList.remove('on'));
      const t = this.cardAt(e.clientX, e.clientY, d.card.dataset.side);
      if (!t){ d.g.remove(); return; }
      this.setLine(d.g, d.a, this.pt(t));
      if (t.dataset.w === d.card.dataset.w){
        d.g.setAttribute('class', 'ok');
        d.card.classList.add('done'); t.classList.add('done');
        this.pairs.push({ g:d.g, a:d.card, b:t });
        Snd.dingdong(); Voice.say(t.dataset.w);
        if (this.pairs.length === 3){
          this.done = true;
          setTimeout(() => Reward.show(this.words, () => this.start()), 1300);
        }
      } else {
        d.g.setAttribute('class', 'bad');
        Snd.ttaeng();
        [d.card, t].forEach(c => { c.classList.remove('wrong'); void c.offsetWidth; c.classList.add('wrong'); });
        setTimeout(() => d.g.remove(), 720);
        setTimeout(() => [d.card, t].forEach(c => c.classList.remove('wrong')), 500);
      }
    };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
  },
  start(){
    this.words = this.deck.takeN(3, (w, out) => out.every(o => o.w[0] !== w.w[0] && o.e !== w.e));
    this.pairs = []; this.done = false; this.drag = null;
    this.svg.innerHTML = ''; this.L.innerHTML = ''; this.R.innerHTML = '';
    const lc = shuffle(this.words.slice());
    let rc = shuffle(this.words.slice());
    if (rc.every((w, i) => w === lc[i])) rc = [rc[1], rc[2], rc[0]];   // 일직선 정답만 나오지 않게
    lc.forEach(w => this.L.insertAdjacentHTML('beforeend', `<div class="mcard mpic" data-side="L" data-w="${w.w}">${w.e}<i class="dot"></i></div>`));
    const pastel = ['#FFD6EA','#D3F7EC','#FFF0BF','#DCEEFF','#EADFFF'];
    rc.forEach((w, i) => this.R.insertAdjacentHTML('beforeend', `<div class="mcard word" data-side="R" data-w="${w.w}" style="--c:${pastel[(i + Math.floor(Math.random()*5)) % 5]}">${w.w}<i class="dot"></i></div>`));
    Voice.say('그림이랑 글자를 쭉 이어 볼까?');
  },
  pt(card){
    const r = this.svg.getBoundingClientRect(), d = card.querySelector('.dot').getBoundingClientRect();
    return { x: d.left + d.width/2 - r.left, y: d.top + d.height/2 - r.top };
  },
  mkLine(cls){
    const g = document.createElementNS(this.NS, 'g'); g.setAttribute('class', cls);
    g.appendChild(document.createElementNS(this.NS, 'line'));
    for (let i=0;i<2;i++){ const c = document.createElementNS(this.NS, 'circle'); c.setAttribute('r', 11); g.appendChild(c); }
    return g;
  },
  setLine(g, a, b){
    const [l, c1, c2] = g.children;
    l.setAttribute('x1', a.x); l.setAttribute('y1', a.y); l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
    c1.setAttribute('cx', a.x); c1.setAttribute('cy', a.y); c2.setAttribute('cx', b.x); c2.setAttribute('cy', b.y);
  },
  cardAt(x, y, fromSide){
    const pad = 26;
    for (const c of this.board.querySelectorAll('.mcard')){
      if (c.dataset.side === fromSide || c.classList.contains('done')) continue;
      const r = c.getBoundingClientRect();
      if (x > r.left-pad && x < r.right+pad && y > r.top-pad && y < r.bottom+pad) return c;
    }
    return null;
  },
  relayout(){
    if (current !== 'scr-match' || !this.pairs) return;
    this.pairs.forEach(p => this.setLine(p.g, this.pt(p.a), this.pt(p.b)));
  }
};

/* 백그라운드 복귀 시 오디오 재개 */
document.addEventListener('pointerdown', () => { if (Snd.ctx && Snd.ctx.state !== 'running') Snd.ctx.resume(); }, true);
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ Voice.stop(); }
  else if (Snd.ctx && Snd.ctx.state !== 'running'){ Snd.ctx.resume(); }
});
})();
</script>
